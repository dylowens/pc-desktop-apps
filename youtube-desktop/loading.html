<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Loading…</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      display: grid;
      place-items: center;
    }
    .wrap { text-align: center; }
    .spinner {
      border: 6px solid #222;
      border-top: 6px solid #e50914;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hint { opacity: 0.8; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <div>Loading YouTube…</div>
    <div class="hint">Tip: Ctrl+W closes, Ctrl+Alt+W quits</div>
  </div>
</body>
</html>
